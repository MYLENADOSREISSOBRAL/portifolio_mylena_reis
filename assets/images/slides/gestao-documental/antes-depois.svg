    <g id="dup"><rect width="90" height="116" rx="6" fill="#F8EBC8" stroke="#E2B33C" stroke-width="3"/><path d="M18 30h54M18 48h54M18 66h40M18 84h48" stroke="#C98A12" stroke-width="6" stroke-linecap="round"/></g>
